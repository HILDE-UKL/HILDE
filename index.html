        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f8f9fa;

            --border: #e0e0e0;

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 2.2rem;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-top: 0;
        }
        .search-box-container {
            display: flex;
            flex-direction: column;
            background: white;
            border: 2px solid var(--border);
            border-radius: 25px; /* Macht das Ganze zur runden Pille */
            margin-bottom: 25px;
            overflow: hidden; /* Sorgt dafür, dass nichts über die Rundung hinausragt */
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        /* Wenn man in das Suchfeld klickt, leuchtet die ganze Pille auf */
        .search-box-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.15);
        }
        
        #searchBox {
            width: 100%;
            padding: 16px 20px 8px 20px;
            font-size: 1.1rem;
            border: none; /* Rahmen übernimmt jetzt der äußere Container */
            background: transparent;
            box-sizing: border-box;
            outline: none;
        }
        
        /* Die kleinen Filter-Optionen unten in der Pille */
        .filter-container {
            display: flex;
            justify-content: flex-start; /* Links ausrichten (oder "center" für mittig) */
            gap: 8px;
            padding: 0 20px 12px 20px;
            flex-wrap: wrap;
            font-size: 0.8rem; /* Schrift kleiner */
        }
        .filter-container label {
            background: #f1f1f1;
            padding: 4px 10px; /* Kleinerer Abstand */
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
            color: #555; /* Etwas weicherer Text */
        }
        .filter-container label:hover {
            background: #e0e0e0;
            color: #333;
        }
        .filter-container input[type="checkbox"] {
            accent-color: var(--accent);
            cursor: pointer;
            width: 13px; /* Checkboxen kleiner */
            height: 13px;
            margin: 0;
        }
        .stats {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        #results {
            display: grid;
            gap: 8px; /* Etwas mehr Luft zwischen den Ergebnissen */
        }
       
.result-card {
    display: flex; 
    padding: 0 !important; 
    overflow: hidden; 
    
    /* Diese Werte haben gefehlt: */
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
}

.card-main-content {
    padding: 15px; 
    flex: 1; 
    /* Neu: Flexbox, damit die Infos links und die Badges rechts nebeneinander stehen */
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

        .card-feedback {
            background-color: #f2f2f2; /* Helleres Grau */
            color: #666; 
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px; /* Schmaler gemacht (vorher 15px) */
            border-left: 1px solid #eaeaea; /* Hellerer Rahmen, passend zum Hintergrund */
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .card-feedback:hover {
            background-color: #e5e5e5; /* Leicht abgedunkelt beim Drüberfahren, aber heller als vorher */
        }

        .feedback-icon {
            font-size: 0.7rem;
        }

        .feedback-text {
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            white-space: nowrap;
            font-size: 0.85rem;
            font-weight: bold;
            /* Sanfte Animation für das Ausklappen */
            transition: max-width 0.3s ease, opacity 0.3s ease, margin-left 0.3s ease;
        }

        /* Der Hover-Effekt auf dem gesamten grauen Bereich lässt den Text erscheinen */
        .card-feedback:hover .feedback-text {
            max-width: 80px; 
            opacity: 1;
            margin-left: 8px;
        }
        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .card-info {
            display: flex;

        .badge-row {
            display: flex;

            flex-wrap: wrap;
            justify-content: flex-end; /* GEÄNDERT: Rechtsbündig */
        }
        .badge {

            padding: 3px 6px;
            border-radius: 6px; /* Ecken etwas weniger rund für den Listen-Look */

            color: white;
            word-wrap: break-word;
            line-height: 1.2;

    window.onload = function() {
        labData.forEach(item => {
        if (item.Labor === "Mikrobiologie" && item.Laborkarte.includes(" - ")) {
            let parts = item.Laborkarte.split(" - ");
            // Der erste Teil wird die Hauptkarte (z.B. "Abstrich", "Serum", "Stuhl,kulturelle Verfahren")
            item.Laborkarte = parts[0].trim();
            
            // Der Rest wird zur Unterkategorie (oder Material), falls noch leer
            let sub = parts.slice(1).join(" - ").trim();
            if (!item.Unterkategorie) {
                item.Unterkategorie = sub;
            } else {
                item.Unterkategorie = sub + " (" + item.Unterkategorie + ")";
            }
        }
    });
        document.getElementById('matchCount').innerText = "Gesamt " + labData.length + " Laborwerte verfügbar. Bitte Suchbegriff eingeben.";

        // --- NEUER CODE: Konsil-Box Logik (mit Hover-Texttausch) ---
        const disziplinen = [
            // Internistisch (häufiger)
            { name: "rheumatologischen", isChirurgie: false },
            { name: "endokrinologischen", isChirurgie: false },
            { name: "gastroenterologischen", isChirurgie: false },
            { name: "nephrologischen", isChirurgie: false },
            { name: "kardiologischen", isChirurgie: false },
            { name: "pneumologischen", isChirurgie: false },
            { name: "hämatologischen", isChirurgie: false },
            { name: "infektiologischen", isChirurgie: false },
            // Chirurgisch (seltener)
            { name: "unfallchirurgischen", isChirurgie: true },
            { name: "viszeralchirurgischen", isChirurgie: true },
            { name: "neurochirurgischen", isChirurgie: true },
            { name: "gefäßchirurgischen", isChirurgie: true }
        ];

        // Zufällige Disziplin auswählen
        const randomDisziplin = disziplinen[Math.floor(Math.random() * disziplinen.length)];
        const konsilBox = document.getElementById('konsilBox');
        
        // Den Originaltext definieren
        const originalText = `"Für die Situationen nach dem <strong>${randomDisziplin.name}</strong> Konsil, in der man Laborwerte sucht, die man noch nie gehört hat."`;
        
        // Initialen Text setzen
        konsilBox.innerHTML = originalText;

        // Hover-Logik nur hinzufügen, wenn es eine chirurgische Disziplin ist
        if (randomDisziplin.isChirurgie) {
            konsilBox.style.cursor = "pointer"; // Zeigt an, dass die Box interaktiv ist
            
            // Wenn die Maus auf die Box fährt:
            konsilBox.addEventListener('mouseenter', function() {
                konsilBox.innerHTML = "<strong>Error: Chirurgen kennen nur BB, CrP und Gerinnung</strong>";
                konsilBox.style.color = "#c0392b"; // Ändert die Textfarbe zu Rot
            });

            // Wenn die Maus die Box wieder verlässt:
            konsilBox.addEventListener('mouseleave', function() {
                konsilBox.innerHTML = originalText;
                konsilBox.style.color = ""; // Setzt die Farbe wieder auf den Standardwert (grau) zurück
            });
        }
        // --- ENDE NEUER CODE ---
    };

    function searchLabor() {
const checkedBoxes = document.querySelectorAll('#laborFilter input[type="checkbox"]:checked');
const activeLabors = Array.from(checkedBoxes).map(cb => cb.value);
        let konsilBox = document.getElementById('konsilBox');
        if (konsilBox) {
            if (document.getElementById('searchBox').value.length > 0) {
                konsilBox.style.display = 'none';
            } else {
                konsilBox.style.display = 'block'; // Kommt zurück, wenn Suchfeld wieder leer ist
            }
        }
	let query = document.getElementById('searchBox').value.toLowerCase().trim();
        let resultsDiv = document.getElementById('results');
        let matchCountSpan = document.getElementById('matchCount');

        if (query === "") {
            resultsDiv.innerHTML = "";
            matchCountSpan.innerText = "Gesamt " + labData.length + " Laborwerte verfügbar. Bitte Suchbegriff eingeben.";
            return;
        }

        let terms = query.split(/\s+/);

        let matches = labData.filter(item => {
if (item.Labor && !activeLabors.includes(item.Labor)) return false;
            // Material und Labor wurden hier aus der Suche entfernt
            let searchableText = [
                item["Name Laborwert"] || "",
                item["Alternativer Name"] || "", // Fehlerkorrektur: Hieß vorher "Alternativer Name 1"
                item["Alternativer Name 2"] || "",
                item["Alternativer Name 3"] || "",
                item["Laborkarte"] || "",
                item["Laborkarte Alternative"] || "",
                item["Unterkategorie"] || "",
                item["Suchwort"] || ""
            ].join(" ").toLowerCase();

            return terms.every(term => searchableText.includes(term));
        });

        matchCountSpan.innerText = matches.length + " Treffer gefunden";
        displayResults(matches);
    }

function displayResults(matches) {
        let resultsDiv = document.getElementById('results');

        // 1. Wenn nichts gefunden wurde:
        if (matches.length === 0) {
            resultsDiv.innerHTML = '<div class="no-results">🔍 Keine passenden Laborwerte gefunden. Versuchen Sie einen anderen Suchbegriff!</div>';
            return;
        }

        let displayItems = matches.slice(0, 100);

        // 2. Für jedes gefundene Ergebnis eine Karte generieren:
        let html = displayItems.map(item => {
            let alts = [item["Alternativer Name"], item["Alternativer Name 2"], item["Alternativer Name 3"]].filter(a => a && a !== "").join(", ");
            
            // Logik zur Farberkennung des Materials
            let matHtml = '';
let materialName = item["Material"] || '-';
if (item["Material"]) {
    let matLower = item["Material"].toLowerCase();
    let matColor = '#7f8c8d'; // Standard: Grau
    let textColor = '#ffffff';

    if (matLower.includes('citrat') || matLower.includes('heparin')) {
        matColor = '#27ae60'; // Grün
    } else if (matLower.includes('urin')) {
        matColor = '#f1c40f'; // Gelb
        textColor = '#333333';
    } else if (matLower.includes('edta')) {
        matColor = '#e74c3c'; // Rot
    } else if (matLower.includes('serum')) {
        matColor = '#c68e17'; // Ocker
    } else if (matLower.includes('stuhl')) {
        matColor = '#8b4513'; // Braun
    }

    // --- NEU: Material-Text umbrechen, wenn er zu lang ist ---
    let formattedMaterial = item["Material"];
    if (formattedMaterial.length > 30) {
        formattedMaterial = formattedMaterial.replace(/\//g, '/<br>');
    }

    // ACHTUNG: Hier am Ende nun ${formattedMaterial} statt${item["Material"]} verwenden!
    matHtml = `<span class="badge" style="background-color: ${matColor}; color: ${textColor};">🧪 Material: ${formattedMaterial}</span>`;
}

            // Deine detaillierte E-Mail Generierung
            let labName = item["Name Laborwert"] || 'Unbekannt';
            let mailSubject = encodeURIComponent(`HILDE Feedback: ${labName}`);
            let mailBody = encodeURIComponent(`FOLGENDEN ÄNDERUNGSWUNSCH HÄTTE ICH: (bitte hier eintragen)



----------------------------------------
Aktuelle Einordnung in HILDE:
Name: ${labName}
Alternativnamen: ${alts || '-'}
Labor: ${item["Labor"] || '-'}
Karte: ${item["Laborkarte"] || '-'}
Alternative Karte: ${item["Laborkarte Alternative"] || '-'}
Unterkategorie: ${item["Unterkategorie"] || '-'}
Material: ${materialName}
`);
            // Die E-Mail-Adresse wird erst im onclick-Event entschlüsselt
            let mailtoAction = `window.location.href='mailto:' + atob('RXJpYy53ZW56ZWxAbWVkaXppbi51bmktbGVpcHppZy5kZQ==') + '?subject=${mailSubject}&body=${mailBody}'; return false;`;

            // Zusammenbau des HTMLs für die aktuelle Karte
            return `
                <div class="result-card">
                    <!-- Hauptinhalt (Links & Mitte) -->
                    <div class="card-main-content">
                        <!-- Links: Namen -->
                        <div class="card-info">
                            <h3 class="lab-value-name">${labName}</h3>
                            ${alts ? `<div class="alt-names">Alternativ: ${alts}</div>` : ''}
                        </div>
                        
                        <!-- Mitte: 3-zeiliger Info-Block -->
                        <div class="card-badges-container">
                            <!-- 1. Zeile: Labor -->
                            <div class="badge-row">
                                <span class="badge badge-labor">🏥 Labor: ${item["Labor"] || '-'}</span>
                            </div>
                            
                            <!-- 2. Zeile: Karten und Kategorie -->
                            <div class="badge-row">
                                <span class="badge badge-karte">📇 Karte: ${item["Laborkarte"] || ''}</span>
                                ${item["Laborkarte Alternative"] ? `<span class="badge badge-alt-karte">🔀 Alt. Karte: ${item["Laborkarte Alternative"]}</span>` : ''}
                                ${item["Unterkategorie"] ? `<span class="badge badge-unterkat">📁 Kategorie: ${item["Unterkategorie"]}</span>` : ''}
                            </div>

                            <!-- 3. Zeile: Material -->
                            ${matHtml ? `<div class="badge-row">${matHtml}</div>` : ''}
                        </div>
                    </div>

                    
                    <!-- Rechts: Feedback Button -->
                    <a href="#" onclick="${mailtoAction}" class="card-feedback" title="Änderung für ${labName} vorschlagen">
                        <span class="feedback-icon">✏️</span>
                        <span class="feedback-text">Feedback</span>
                    </a>
                </div>
            `;
        }).join(''); 

        // Falls es mehr als 100 Treffer gibt
        if (matches.length > 100) {
            html += '<div style="text-align: center; color: #777; padding: 10px;">... und ' + (matches.length - 100) + ' weitere Treffer. Bitte Suche verfeinern.</div>';
        }

        // 3. Das generierte HTML auf der Seite anzeigen
        resultsDiv.innerHTML = html;
    }
function initLaborFilter() {
    const laborSet = new Set();
    labData.forEach(item => {
        if(item.Labor) laborSet.add(item.Labor);
    });
    
    const filterContainer = document.getElementById('laborFilter');
    filterContainer.innerHTML = '';
    
    laborSet.forEach(labor => {
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = labor;
        checkbox.checked = true; // Standardmäßig sind alle ausgewählt
        checkbox.onchange = searchLabor; // Bei Klick sofort neu suchen
        
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(labor));
        filterContainer.appendChild(label);
    });
}

// Funktion direkt beim Laden der Seite aufrufen:
initLaborFilter();

</script>
